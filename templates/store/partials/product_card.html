<div class="product-card">
    <a href="{{ product.get_absolute_url }}" class="product-image-link">
        <div class="product-image">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}" loading="lazy">
            {% else %}
                <div class="product-placeholder">🛍️</div>
            {% endif %}
            {% if not product.in_stock %}
                <span class="badge badge-danger">نفد المخزون</span>
            {% endif %}
        </div>
    </a>
    <div class="product-info">
        <span class="product-category">{{ product.category.name }}</span>
        <h3 class="product-name">
            <a href="{{ product.get_absolute_url }}">{{ product.name }}</a>
        </h3>
        <div class="product-footer">
            <span class="product-price">{{ product.price }} ر.س</span>
            {% if product.in_stock %}
            <form action="{% url 'cart:cart_add' product.id %}" method="post" class="add-to-cart-form">
                {% csrf_token %}
                <input type="hidden" name="quantity" value="1">
                <button type="submit" class="btn btn-sm btn-primary">أضف للسلة</button>
            </form>
            {% endif %}
        </div>
    </div>
</div>
